# queue.yml - URLs waiting to be ingested into the wiki pipeline
#
# Add URLs under the appropriate section. Running the ingest scripts
# (or asking Claude to "process the queue") will:
#   1. Fetch each URL's content into active_sources/<type>/<slug>/
#   2. Generate a wiki page in wiki/articles/ or wiki/videos/
#   3. Move the source to cold_storage/<type>/<slug>/
#   4. Remove the URL from this file
#
# See wiki/queue-schema.md for full field reference.

articles:
  # Medium posts, blog articles, anything with readable text
  # Format: just a URL string, OR an object with optional metadata
  #
  # Examples (remove when adding real entries):
  # - https://karpathy.medium.com/yes-you-should-understand-backprop-e2f06eab496b
  # - url: https://simonwillison.net/2024/some-post
  #   tags: [llm, prompt-engineering]
  #   priority: high

youtube:
  channels:
    # Full channel ingestion via RSS feed
    # Format: URL string or channel handle
    #
    # Examples:
    # - https://youtube.com/@AndrejKarpathy
    # - "@3blue1brown"

  videos:
    # Individual video transcripts
    # Format: URL string or object with metadata
    #
    # Examples:
    # - https://youtube.com/watch?v=zjkBMFhNj_g
    # - url: https://youtu.be/some-id
    #   tags: [transformers, interpretability]

repos:
  # GitHub repos (alternative to manually cloning)
  # These will be cloned into active_sources/repos/
  #
  # Examples:
  # - https://github.com/karpathy/nanoGPT
  # - https://github.com/owner/repo
