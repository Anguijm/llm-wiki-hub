# tracked_channels.yml
#
# Persistent subscription list of YouTube channels to ingest on every run.
#
# Distinct from queue.yml: entries here are re-scanned on each run (new
# videos are picked up, duplicates are skipped via fingerprints.json),
# and they are NOT removed after processing. queue.yml is for one-shot
# URLs; this file is for ongoing subscriptions.
#
# Run:
#   python scripts/ingest-youtube.py --from-tracked
#
# The ingest script deduplicates via cold_storage/fingerprints.json,
# so only new videos produce transcripts on each run. Videos whose
# transcript fetch fails (network error, rate limit) are retried on
# the next run.

channels:
  # Ported from yolo-projects Phase 4 YouTube research pipeline:
  # https://github.com/Anguijm/yolo-projects/blob/main/fetch_youtube_rss.py
  # Daily cron scans these RSS feeds for new videos and extracts
  # experiment cards for the yolo builder system.
  yolo-phase4:
    tags: [yolo-phase4, ai-dev, research]
    limit: 10   # max latest videos per channel per run
    sources:
